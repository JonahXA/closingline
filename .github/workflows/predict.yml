name: Daily forecasts

on:
  schedule:
    - cron: "0 11 * * *"  # 11:00 UTC daily
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write  # to dispatch the deploy workflow after committing

jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache match data
        uses: actions/cache@v4
        with:
          path: |
            data/raw
            data/xg
            data/xg_players
          key: football-data-${{ github.run_id }}
          restore-keys: football-data-

      - name: Install
        run: pip install -e .

      - name: Ingest data
        run: closingline ingest

      - name: Issue forecasts
        run: closingline predict

      - name: Log and settle paper bets
        run: |
          closingline paper
          closingline paper --settle || true

      - name: Update live scorecard
        run: closingline scorecard

      # Regenerate the dashboard's data file so the live site reflects
      # today's forecasts, settled paper bets, and scorecard. Without this
      # the dashboard froze at the first settlement (showed 1 stale bet).
      - name: Refresh dashboard data
        run: closingline export

      - name: Commit new forecasts
        run: |
          git config user.name "closingline-bot"
          git config user.email "actions@github.com"
          # paper/ and predictions/ may not exist yet (no fixtures in the
          # off-season). A missing pathspec aborts `git add` with exit 128 —
          # that silently killed this job for three days in July 2026 — so
          # ensure both exist before staging.
          mkdir -p predictions paper reports
          git add predictions/ paper/ reports/scorecard.csv reports/scorecard_status.csv \
                  dashboard/public/data.json
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "Forecasts issued $(date -u +%F)"
            git push
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi
        id: commit

      # Commits pushed by GITHUB_TOKEN do NOT trigger other workflows (a
      # GitHub loop-guard), so the push above never fired the deploy — the
      # live site froze at the last human push (Sep 11 -> Sep 18). Dispatch
      # the deploy explicitly so the dashboard actually updates each day.
      - name: Deploy the refreshed dashboard
        if: steps.commit.outputs.committed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'pages.yml',
              ref: 'main',
            });

      # A silent failure here means missing pre-registered forecasts, which
      # cannot be backfilled honestly — so make breakage loud.
      - name: Open an issue if the run failed
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Daily forecast run failed';
            const {data: open} = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'pipeline',
            });
            const body = `Run [${context.runId}](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) failed on ${new Date().toISOString().slice(0,10)}. Forecasts for today may be missing and cannot be backfilled without breaking pre-registration.`;
            if (open.some(i => i.title === title)) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: open.find(i => i.title === title).number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['pipeline'],
              });
            }
